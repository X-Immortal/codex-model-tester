name: macOS application bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build universal .app and .dmg
        run: scripts/build-macos-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: codex-model-tester-macos-universal
          path: dist/Codex-Model-Tester-macos-universal.dmg
          if-no-files-found: error
