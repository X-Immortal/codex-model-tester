appId: dev.codexmodeltester.desktop
productName: Codex Backend Model Tester
asar: true
directories:
  output: ../dist/desktop
  buildResources: assets
files:
  - main.js
  - preload.js
  - package.json
  - assets/icon.png
extraResources:
  - from: backend
    to: backend
  - from: ../LICENSE
    to: LICENSE.txt
  - from: NOTICE.txt
    to: NOTICE.txt
win:
  target:
    - nsis
  icon: assets/icon.png
  artifactName: Codex-Model-Tester-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Codex Model Tester
  deleteAppDataOnUninstall: false
mac:
  target:
    - zip
  icon: assets/icon.png
  category: public.app-category.developer-tools
  identity: null
  artifactName: Codex-Model-Tester-${version}-${arch}.${ext}
dmg:
  title: Codex Model Tester
  contents:
    - x: 150
      y: 190
    - x: 410
      y: 190
      type: link
      path: /Applications
